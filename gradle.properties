# The version these artefacts publish under, and the tag that publishes them:
# releasing means bumping this and tagging v<version>. It is here rather than
# in the build because the Gradle plugin reads it back at runtime to name the
# API and processor a plugin author compiles against — a version that lags the
# tag would pair the plugin with an API from a different release, silently.
declaredVersion=0.2.2

# The Java baseline, in one place because three build files ask for it. See the
# root build for why it is 25 and not something older.
javaVersion=25

# JUnit, likewise named once for the three test suites.
junitVersion=5.11.4

# Where the ABI schema lives: the sibling gocraft-abi checkout, since
# deliverable 01 gave abi/v1 its own repository. Still a path rather than a
# dependency, because buf reads .proto files from a directory and Gradle has no
# way to hand it a Go module.
#
# Only `generateProto` reads it. A plain build needs nothing here: the generated
# sources are committed.
abiSchema=../gocraft-abi
