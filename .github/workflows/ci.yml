# What runs on the way in, so a tag is never the first time anything is checked.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Gradle fetches the Java 25 toolchain itself through the foojay
      # resolver, so this only has to be new enough to run Gradle.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew build --no-daemon
